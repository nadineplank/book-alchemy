{% extends "base.html" %}

{% block title %}Add Author — Book Alchemy{% endblock %}

{% block content %}

    <form action="{{ url_for('add_author') }}" method="POST" class="page-form">
        <div class="form-group">
            <label for="name">Author Name</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="birthdate">Birthdate</label>
            <input type="date" id="birthdate" name="birthdate" required>
        </div>

        <div class="form-group">
            <label for="date_of_death">Date of Death</label>
            <input type="date" id="date_of_death" name="date_of_death">
        </div>

        <button type="submit" class="form-submit">Add Author</button>
    </form>

{% endblock %}
