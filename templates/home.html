{% extends "base.html" %}

{% block content %}

<div class="toolbar">
    <form action="/" method="GET" class="search-form">
        <label for="search" class="search-label">Search</label>
        <input type="text" id="search" name="search" class="search-input">
        <button type="submit" class="search-button" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="none"
                 stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
        </button>
    </form>


    <label for="sort-select">
        Sort by
    </label>
    <select id="sort-select" class="sort-dropdown">
        <option value="title" {% if sort == "title" %}selected{% endif %}>Title</option>
        <option value="author" {% if sort == "author" %}selected{% endif %}>Author</option>
    </select>
</div>

{% if books %}
    <div class="book-grid">
        {% for book in books %}
            <div class="book-card">
                <img src="https://covers.openlibrary.org/b/isbn/{{ book.isbn }}-M.jpg" alt="{{ book.title }} cover"
                     class="book-cover"/>
                <p class="book-title">{{ book.title }}</p>
                <p class="book-author">{{ book.author.name }}</p>

                <form action="{{ url_for('delete_book', book_id=book.id) }}" method="POST"
                      class="inline-form" onsubmit="return confirm('Are you sure you want to delete this book?');">
                    <button type="submit" class="icon-btn icon-btn--danger" title="Delete">
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
                            <path d="M3 6v18h18v-18h-18zm5 14c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm5 0c0 .552-.448 1-1 1s-1-.448-1-1v-10c0-.552.448-1 1-1s1 .448 1 1v10zm4-18v2h-20v-2h5.711c.9 0 1.631-1.099 1.631-2h5.315c0 .901.73 2 1.631 2h5.712z"/>
                        </svg>
                    </button>
                </form>

            </div>
        {% endfor %}
    </div>
{% else %}
    <a class="go_back_link" href="/">&larr; Go Back</a>
    <p class="no_result">No books found for "{{ search }}"</p>
{% endif %}

<script>
    document.getElementById('sort-select').addEventListener('change', function () {
        window.location.href = '/?sort=' + this.value {% if search %} + '&search={{ search }}' {% endif %};
    });
</script>

{% endblock %}
